<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="../src/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Product Management</h1>
        <div id="product-list">
            <h2>Product List</h2>
            <ul id="products"></ul>
        </div>
        <div id="product-form">
            <h2 id="form-title">Add Product</h2>
            <form id="form">
                <input type="hidden" id="product-id">
                <label for="product-nombre">Product Name:</label>
                <input type="text" id="product-nombre" required>
                <label for="product-categoria">Category:</label>
                <input type="text" id="product-categoria" required>
                <label for="product-precio">Product Price:</label>
                <input type="number" id="product-precio" step="0.01" required>
                <label for="product-imgUrl">Image URL:</label>
                <input type="url" id="product-imgUrl">
                <button type="submit">Save Product</button>
            </form>
        </div>
    </div>
    <script src="../src/js/api.js"></script>
    <script src="../src/js/app.js"></script>
</body>
</html>
